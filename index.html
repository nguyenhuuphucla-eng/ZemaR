<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zema R - Quản Lý Hình Ảnh (Cloud Sync)</title>

  <!-- PWA iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zema R">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/z.png">

  <!-- Tailwind CSS, Lucide Icons & Tesseract OCR -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .has-photos {
      background-color: #10b981 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .no-photos {
      opacity: 0.25;
      background-color: #334155;
      color: #94a3b8;
    }
    .selected-day {
      outline: 3px solid #ec4899;
      transform: scale(1.05);
      z-index: 10;
    }
    .zema-logo {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      color: white;
      font-weight: 900;
      font-family: 'Arial Black', sans-serif;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(236, 72, 153, 0.5);
    }
    #modalImg {
      pointer-events: auto !important;
      touch-action: none !important;
      will-change: transform;
      transition: transform 0.05s linear;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-10">

  <!-- Màn hình Loading -->
  <div id="ocrLoadingModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 p-5 rounded-2xl flex flex-col items-center gap-3 text-center shadow-2xl max-w-xs w-full">
      <div class="w-8 h-8 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
      <p id="ocrLoadingText" class="font-bold text-pink-400 text-xs">Đang nén & đẩy ảnh lên Cloud Google...</p>
    </div>
  </div>

  <!-- Header chọn Chi Nhánh -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-4 shadow-xl">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="zema-logo w-12 h-12 text-2xl italic transform -skew-x-6">Z</div>
        <div>
          <h1 class="text-2xl font-black tracking-wider text-pink-500 leading-none">ZEMA R</h1>
          <span class="text-xs text-slate-400 font-bold tracking-wide flex items-center gap-1">
            Quản Lý Ảnh <span id="cloudStatus" class="w-2 h-2 rounded-full bg-emerald-500 inline-block" title="Đã nối Cloud"></span>
          </span>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-1 justify-end">
        <select id="branchSelect" onchange="onBranchChange()" class="bg-slate-800 text-pink-400 border-2 border-pink-500/40 font-black text-sm rounded-2xl px-3.5 py-2.5 outline-none max-w-[210px] truncate shadow-lg">
        </select>
        <button onclick="promptAdminBranch()" class="bg-slate-800 text-slate-300 p-3 rounded-2xl border border-slate-700 shrink-0 shadow-lg active:scale-95 transition-transform">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Container Chính -->
  <main class="max-w-md mx-auto w-full flex-1 px-4 py-3 space-y-3">

    <!-- Lịch chọn ngày -->
    <section class="bg-slate-900/80 rounded-2xl border border-slate-800 shadow-xl overflow-hidden">
      <button onclick="toggleCalendar()" class="w-full flex justify-between items-center p-3 bg-slate-900 hover:bg-slate-800/80 transition-colors">
        <div class="flex items-center gap-2">
          <i data-lucide="calendar" class="w-4 h-4 text-pink-500"></i>
          <span id="calendarSelectedTitle" class="font-bold text-xs text-pink-400 uppercase tracking-wider">Ngày --/--/----</span>
        </div>
        <div class="flex items-center gap-1.5 text-xs text-slate-400">
          <span id="calendarMonthYear" class="font-semibold text-[11px] text-slate-300">Tháng --/----</span>
          <i id="calendarChevron" data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200"></i>
        </div>
      </button>

      <div id="calendarBody" class="hidden p-3 pt-0 border-t border-slate-800/60">
        <div class="flex justify-between items-center my-2 px-1">
          <button onclick="changeMonth(-1)" class="p-1 hover:bg-slate-800 rounded-lg text-slate-400"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
          <span class="text-xs font-bold text-slate-300 uppercase">Chọn ngày xem ảnh</span>
          <button onclick="changeMonth(1)" class="p-1 hover:bg-slate-800 rounded-lg text-slate-400"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-1.5">
          <span>CN</span><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span>
        </div>

        <div id="calendarDays" class="grid grid-cols-7 gap-1"></div>
      </div>
    </section>

    <!-- Thư mục & Nút Chụp -->
    <section class="space-y-3">
      <div class="flex items-center justify-between gap-1.5">
        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 flex-1 overflow-x-auto gap-1">
          <button onclick="switchFolder('tat_ca')" id="tab-tat_ca" class="flex-1 min-w-[50px] py-1.5 text-[10px] font-bold rounded-lg transition-all text-pink-400 bg-slate-800">
            Tất Cả <span id="count-tat_ca" class="text-[9px] opacity-75">(0)</span>
          </button>
          <button onclick="switchFolder('may')" id="tab-may" class="flex-1 min-w-[50px] py-1.5 text-[10px] font-bold rounded-lg transition-all text-slate-400">
            Máy <span id="count-may" class="text-[9px] opacity-75">(0)</span>
          </button>
          <button onclick="switchFolder('phieu_sua')" id="tab-phieu_sua" class="flex-1 min-w-[50px] py-1.5 text-[10px] font-bold rounded-lg transition-all text-slate-400">
            Phiếu <span id="count-phieu_sua" class="text-[9px] opacity-75">(0)</span>
          </button>
          <button onclick="switchFolder('hoa_don')" id="tab-hoa_don" class="flex-1 min-w-[50px] py-1.5 text-[10px] font-bold rounded-lg transition-all text-slate-400">
            Hóa Đơn <span id="count-hoa_don" class="text-[9px] opacity-75">(0)</span>
          </button>
        </div>

        <div class="flex items-center gap-1 shrink-0">
          <button onclick="triggerCameraInput()" class="bg-gradient-to-r from-pink-500 to-rose-600 text-white font-bold px-3.5 py-2.5 rounded-xl shadow-lg flex items-center gap-1.5 text-xs active:scale-95 transition-transform">
            <i data-lucide="camera" class="w-4 h-4"></i> Chụp
          </button>
        </div>

        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageCapture(event)">
      </div>

      <!-- Thanh chọn nhiều ảnh -->
      <div id="batchBar" class="hidden bg-slate-900 border border-pink-500/40 rounded-xl p-2.5 flex flex-col gap-2 shadow-lg">
        <div class="flex items-center justify-between">
          <button onclick="toggleSelectAll()" class="bg-slate-800 hover:bg-slate-700 text-pink-400 text-xs px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 border border-pink-500/30">
            <i data-lucide="check-square" class="w-3.5 h-3.5"></i> <span id="btnSelectAllText">Chọn Tất Cả</span>
          </button>
          <span class="text-xs font-semibold text-slate-200">Đã chọn <b id="batchCount" class="text-pink-400">0</b> ảnh</span>
          <button onclick="exitBatchMode()" class="bg-slate-800 text-slate-400 text-xs px-2 py-1 rounded-lg">Thoát</button>
        </div>

        <div class="flex gap-2 pt-1 border-t border-slate-800">
          <button onclick="batchSaveToPhotos()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2 rounded-lg font-bold flex items-center justify-center gap-1">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Lưu Album
          </button>
          <button onclick="batchShare()" class="flex-1 bg-pink-600 hover:bg-pink-500 text-white text-xs py-2 rounded-lg font-bold flex items-center justify-center gap-1">
            <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Chia Sẻ
          </button>
          <button onclick="batchDelete()" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center justify-center gap-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Xóa
          </button>
        </div>
      </div>
    </section>

    <!-- Lưới Ảnh -->
    <section>
      <div id="imageGrid" class="grid grid-cols-2 gap-3"></div>
      <div id="emptyState" class="hidden text-center py-12 text-slate-500 space-y-2">
        <i data-lucide="cloud-off" class="w-10 h-10 mx-auto text-slate-600"></i>
        <p class="text-xs font-medium">Chưa có ảnh nào trên Cloud cho mục này</p>
      </div>
    </section>

  </main>

  <!-- Viewer Xem Ảnh Phóng To (Chạm zoom & kéo bằng tay) -->
  <div id="imageModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-between p-4">
    <div class="flex justify-between items-center text-white z-10">
      <div class="flex gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-slate-700">
        <span class="text-[10px] text-slate-400 flex items-center px-1 font-semibold">Mục:</span>
        <button onclick="changeImageFolder('may')" class="px-2 py-1 text-[10px] font-bold rounded-lg bg-slate-800 hover:bg-pink-600 text-slate-200">Máy</button>
        <button onclick="changeImageFolder('phieu_sua')" class="px-2 py-1 text-[10px] font-bold rounded-lg bg-slate-800 hover:bg-pink-600 text-slate-200">Phiếu Sửa</button>
        <button onclick="changeImageFolder('hoa_don')" class="px-2 py-1 text-[10px] font-bold rounded-lg bg-slate-800 hover:bg-pink-600 text-slate-200">Hóa Đơn</button>
      </div>
      <button onclick="closeModal()" class="p-2 bg-slate-800/80 rounded-full text-slate-300"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <!-- Màn hình hiển thị ảnh hỗ trợ chạm zoom/kéo -->
    <div id="modalImgContainer" class="flex-1 flex items-center justify-center overflow-hidden my-auto w-full relative">
      <img id="modalImg" class="max-h-[75vh] max-w-full object-contain" alt="Preview">
    </div>

    <!-- Thanh công cụ bên dưới -->
    <div class="flex justify-around items-center bg-slate-900/90 backdrop-blur-md rounded-2xl py-3 border border-slate-800 z-10">
      <button onclick="saveSingleToPhotos()" class="flex flex-col items-center text-emerald-400 text-xs gap-1 font-semibold"><i data-lucide="download" class="w-5 h-5 text-emerald-400"></i> Lưu về máy</button>
      <button onclick="shareSingleImage()" class="flex flex-col items-center text-pink-400 text-xs gap-1 font-semibold"><i data-lucide="share-2" class="w-5 h-5 text-pink-400"></i> Chia sẻ</button>
      <button onclick="deleteSingleImage()" class="flex flex-col items-center text-red-400 text-xs gap-1 font-semibold"><i data-lucide="trash-2" class="w-5 h-5 text-red-500"></i> Xóa</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 💥 DÁN MÃ FIREBASE CONFIG CỦA ÔNG VÀO ĐÂY 💥
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyATkvZNedy1vDx-yupT0IFUrImit-jTYkk",
  authDomain: "zemar-2b24e.firebaseapp.com",
  projectId: "zemar-2b24e",
  storageBucket: "zemar-2b24e.firebasestorage.app",
  messagingSenderId: "901360040870",
  appId: "1:901360040870:web:485de54f94d60a81526d67",
  measurementId: "G-6F6EM849R8"
    };

    // Khởi tạo Firebase
    firebase.initializeApp(firebaseConfig);
    const firestore = firebase.firestore();

    const ADMIN_PASS = "0000";
    const DEFAULT_BRANCHES = [
      "CN 190 3/2", "CN 352 Trường Chinh", "CN 101 Bùi Thị Xuân",
      "CN 04 Hai Bà Trưng", "CN 76 Quốc Hương", "CN 45 Cao Thắng",
      "CN 84 Nguyễn Thị Thập", "CN 12 Phan Văn Trị", "CN 25 Hoàng Văn Thụ",
      "CN 18 Phạm Văn Đồng", "CN 09 Quang Trung", "CN 33 Võ Văn Ngân", "CN 52 Kinh Dương Vương"
    ];

    let currentBranch = "";
    let selectedDate = new Date().toISOString().split('T')[0];
    let calendarMonth = new Date().getMonth();
    let calendarYear = new Date().getFullYear();
    let currentFolder = "tat_ca";
    let ocrWorker = null;

    let isCalendarOpen = false;
    let currentFolderPhotosCache = [];
    let isBatchMode = false;
    let selectedImageIds = new Set();
    let activeModalImgId = null;

    // Biến điều khiển Zoom & Pan (Vuốt bằng tay)
    let scale = 1, posX = 0, posY = 0;
    let startX = 0, startY = 0;
    let initialDist = 0, initialScale = 1;
    let lastTapTime = 0;

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      initBranches();
      await renderCalendar();
      listenToCloudPhotos();
      initOCRWorker();
      initTouchZoomPan();
    });

    async function initOCRWorker() {
      try {
        if (typeof Tesseract !== 'undefined') {
          ocrWorker = await Tesseract.createWorker('vie');
        }
      } catch (e) { console.log("OCR Error:", e); }
    }

    function initBranches() {
      let savedBranches = JSON.parse(localStorage.getItem('zema_branches')) || DEFAULT_BRANCHES;
      localStorage.setItem('zema_branches', JSON.stringify(savedBranches));
      currentBranch = localStorage.getItem('zema_current_branch') || savedBranches[0];
      renderBranchDropdown(savedBranches);
    }

    function renderBranchDropdown(branches) {
      const select = document.getElementById('branchSelect');
      select.innerHTML = branches.map(b => `<option value="${b}" ${b === currentBranch ? 'selected' : ''}>${b}</option>`).join('');
    }

    function onBranchChange() {
      currentBranch = document.getElementById('branchSelect').value;
      localStorage.setItem('zema_current_branch', currentBranch);
      exitBatchMode();
      renderCalendar();
      listenToCloudPhotos();
    }

    function promptAdminBranch() {
      const pass = prompt("Nhập mật khẩu xác nhận (Mặc định: 0000):");
      if (pass !== ADMIN_PASS) { alert("Mật khẩu không chính xác!"); return; }

      const action = prompt("1. Thêm Chi Nhánh Mới\n2. Đổi Tên Chi Nhánh Hiện Tại", "1");
      let branches = JSON.parse(localStorage.getItem('zema_branches')) || DEFAULT_BRANCHES;

      if (action === "1") {
        const newName = prompt("Nhập tên chi nhánh mới:");
        if (newName && newName.trim()) { branches.push(newName.trim()); currentBranch = newName.trim(); }
      } else if (action === "2") {
        const newName = prompt("Nhập tên mới cho [" + currentBranch + "]:");
        if (newName && newName.trim()) {
          const idx = branches.indexOf(currentBranch);
          if (idx !== -1) branches[idx] = newName.trim();
          currentBranch = newName.trim();
        }
      }
      localStorage.setItem('zema_branches', JSON.stringify(branches));
      localStorage.setItem('zema_current_branch', currentBranch);
      renderBranchDropdown(branches);
      renderCalendar();
      listenToCloudPhotos();
    }

    function toggleCalendar() {
      isCalendarOpen = !isCalendarOpen;
      document.getElementById('calendarBody').classList.toggle('hidden', !isCalendarOpen);
      document.getElementById('calendarChevron').classList.toggle('rotate-180', isCalendarOpen);
    }

    async function renderCalendar() {
      const titleElem = document.getElementById('calendarSelectedTitle');
      const monthYearElem = document.getElementById('calendarMonthYear');
      const daysContainer = document.getElementById('calendarDays');
      const monthNames = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];

      const [sY, sM, sD] = selectedDate.split('-');
      titleElem.innerText = `Ngày ${sD}/${sM}/${sY}`;
      monthYearElem.innerText = `${monthNames[calendarMonth]} / ${calendarYear}`;

      const datesWithPhotos = new Set();
      try {
        const snapshot = await firestore.collection("photos")
          .where("branch", "==", currentBranch)
          .get();

        snapshot.forEach(doc => {
          const d = doc.data().date;
          if (d) datesWithPhotos.add(d);
        });
      } catch (err) {
        console.error("Lỗi tải lịch:", err);
      }

      const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
      const totalDays = new Date(calendarYear, calendarMonth + 1, 0).getDate();

      daysContainer.innerHTML = "";
      for (let i = 0; i < firstDay; i++) daysContainer.innerHTML += `<div></div>`;

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasPhotos = datesWithPhotos.has(dateStr);
        const isSelected = dateStr === selectedDate;

        const dayElem = document.createElement('div');
        dayElem.className = `calendar-day ${hasPhotos ? 'has-photos' : 'no-photos'} ${isSelected ? 'selected-day' : ''}`;
        dayElem.innerText = day;
        dayElem.onclick = (e) => {
          e.stopPropagation();
          selectedDate = dateStr;
          renderCalendar();
          listenToCloudPhotos();
        };
        daysContainer.appendChild(dayElem);
      }
    }

    function changeMonth(delta) {
      calendarMonth += delta;
      if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
      if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
      renderCalendar();
    }

    function switchFolder(folder) {
      currentFolder = folder;
      ['tat_ca', 'may', 'phieu_sua', 'hoa_don'].forEach(f => {
        const btn = document.getElementById(`tab-${f}`);
        if (btn) {
          btn.className = (f === folder)
            ? "flex-1 min-w-[50px] py-1.5 text-[10px] font-bold rounded-lg transition-all text-pink-400 bg-slate-800"
            : "flex-1 min-w-[50px] py-1.5 text-[10px] font-bold rounded-lg transition-all text-slate-400";
        }
      });
      exitBatchMode();
      listenToCloudPhotos();
    }

    function listenToCloudPhotos() {
      const grid = document.getElementById('imageGrid');
      const emptyState = document.getElementById('emptyState');

      firestore.collection("photos")
        .where("branch", "==", currentBranch)
        .where("date", "==", selectedDate)
        .onSnapshot((snapshot) => {
          const allPhotos = [];
          snapshot.forEach(doc => {
            allPhotos.push({ id: doc.id, ...doc.data() });
          });

          document.getElementById('count-tat_ca').innerText = `(${allPhotos.length})`;
          document.getElementById('count-may').innerText = `(${allPhotos.filter(p => p.folder === 'may').length})`;
          document.getElementById('count-phieu_sua').innerText = `(${allPhotos.filter(p => p.folder === 'phieu_sua').length})`;
          document.getElementById('count-hoa_don').innerText = `(${allPhotos.filter(p => p.folder === 'hoa_don').length})`;

          if (currentFolder === 'tat_ca') {
            currentFolderPhotosCache = allPhotos;
          } else {
            currentFolderPhotosCache = allPhotos.filter(p => p.folder === currentFolder);
          }

          grid.innerHTML = "";
          if (currentFolderPhotosCache.length === 0) {
            emptyState.classList.remove('hidden');
            return;
          }
          emptyState.classList.add('hidden');

          currentFolderPhotosCache.forEach(photo => {
            const card = document.createElement('div');
            card.className = "relative rounded-xl overflow-hidden bg-slate-900 border border-slate-800 shadow-lg cursor-pointer select-none active:scale-95 transition-transform";

            const imgContainer = document.createElement('div');
            imgContainer.className = "relative aspect-square bg-slate-950";

            const img = document.createElement('img');
            img.src = photo.dataUrl;
            img.className = "w-full h-full object-cover pointer-events-none";

            const checkOverlay = document.createElement('div');
            checkOverlay.className = `absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-white flex items-center justify-center ${selectedImageIds.has(photo.id) ? 'bg-pink-500 border-pink-500' : 'bg-black/40'}`;
            if (selectedImageIds.has(photo.id)) checkOverlay.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>`;

            imgContainer.appendChild(img);
            imgContainer.appendChild(checkOverlay);
            card.appendChild(imgContainer);

            let pressTimer = null;
            let isLongPress = false;

            const startPress = () => {
              isLongPress = false;
              pressTimer = setTimeout(() => {
                isLongPress = true;
                if (navigator.vibrate) navigator.vibrate(40);
                toggleBatchSelect(photo.id);
              }, 500);
            };

            const cancelPress = () => {
              if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
            };

            card.addEventListener('touchstart', startPress, { passive: true });
            card.addEventListener('touchend', cancelPress);
            card.addEventListener('touchmove', cancelPress, { passive: true });

            card.addEventListener('mousedown', startPress);
            card.addEventListener('mouseup', cancelPress);
            card.addEventListener('mouseleave', cancelPress);

            card.onclick = () => {
              if (isLongPress) { isLongPress = false; return; }
              if (isBatchMode) { toggleBatchSelect(photo.id); }
              else { openSingleImageModal(photo); }
            };

            grid.appendChild(card);
          });
          lucide.createIcons();
        }, (error) => {
          console.error("Lỗi Cloud:", error);
        });
    }

    function triggerCameraInput() { document.getElementById('cameraInput').click(); }

    function removeVietnameseTones(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toUpperCase();
    }

    function cropTopHeaderForOCR(dataUrl, maxWidth) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const cropHeight = img.height * 0.30;
          const scaleRatio = maxWidth / img.width;
          canvas.width = maxWidth;
          canvas.height = cropHeight * scaleRatio;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, img.width, cropHeight, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = dataUrl;
      });
    }

    async function autoDetectFolderWithOCR(dataUrl) {
      try {
        const croppedHeaderUrl = await cropTopHeaderForOCR(dataUrl, 500);
        if (!ocrWorker) ocrWorker = await Tesseract.createWorker('vie');
        const ret = await ocrWorker.recognize(croppedHeaderUrl);
        const cleanText = removeVietnameseTones(ret.data.text || "");

        if (cleanText.includes("HOA DON") || cleanText.includes("BAN LE") || cleanText.includes("THANH TIEN")) return "hoa_don";
        if (cleanText.includes("PHIEU") || cleanText.includes("SUA CHUA") || cleanText.includes("DE XUAT")) return "phieu_sua";
        return "may";
      } catch (err) { return "may"; }
    }

    async function handleImageCapture(event) {
      const file = event.target.files[0];
      if (!file) return;

      const captureBranch = currentBranch;
      const loadingModal = document.getElementById('ocrLoadingModal');
      document.getElementById('ocrLoadingText').innerText = "Đang nén & đẩy ảnh lên Cloud Google...";
      loadingModal.classList.remove('hidden');

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const rawDataUrl = e.target.result;
          const now = new Date();
          const dateFormatted = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
          const dateKey = now.toISOString().split('T')[0];

          const detectedFolder = await autoDetectFolderWithOCR(rawDataUrl);
          const stampedDataUrl = await addWatermarkToImage(rawDataUrl, captureBranch, dateFormatted);

          await firestore.collection("photos").add({
            branch: captureBranch,
            date: dateKey,
            folder: detectedFolder,
            capturedDate: dateFormatted,
            dataUrl: stampedDataUrl,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          selectedDate = dateKey;
          switchFolder(detectedFolder);
          renderCalendar();
        } catch (err) {
          alert("❌ Lỗi tải ảnh: " + err.message);
        } finally {
          loadingModal.classList.add('hidden');
          event.target.value = "";
        }
      };

      reader.readAsDataURL(file);
    }

    function addWatermarkToImage(dataUrl, branchName, dateStr) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 1000;
          let scaleRatio = 1;
          if (img.width > MAX_WIDTH) scaleRatio = MAX_WIDTH / img.width;

          canvas.width = img.width * scaleRatio;
          canvas.height = img.height * scaleRatio;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const barHeight = Math.max(50, Math.round(canvas.height * 0.1));
          const gradient = ctx.createLinearGradient(0, canvas.height - barHeight, 0, canvas.height);
          gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
          gradient.addColorStop(1, 'rgba(0, 0, 0, 0.9)');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

          const fontSizeMain = Math.max(18, Math.round(canvas.width * 0.04));
          const fontSizeSub = Math.max(12, Math.round(canvas.width * 0.028));
          const marginX = Math.round(canvas.width * 0.03);

          ctx.fillStyle = '#FFFFFF';
          ctx.font = `bold ${fontSizeMain}px -apple-system, BlinkMacSystemFont, Arial`;
          ctx.fillText(branchName, marginX, canvas.height - (fontSizeSub * 2.3));

          ctx.fillStyle = '#FFFFFF';
          ctx.font = `${fontSizeSub}px -apple-system, BlinkMacSystemFont, Arial`;
          ctx.fillText(`${dateStr} `, marginX, canvas.height - (fontSizeSub * 0.8));

          const dateWidth = ctx.measureText(`${dateStr} `).width;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.font = `italic ${fontSizeSub}px -apple-system, BlinkMacSystemFont, Arial`;
          ctx.fillText('@ Nguyễn Hữu Phúc', marginX + dateWidth, canvas.height - (fontSizeSub * 0.8));

          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = dataUrl;
      });
    }

    // =======================================================
    // 🖐️ XỬ LÝ CẢM ỨNG CHẠM ZOOM 2 NGÓN & KÉO DI CHUYỂN ẢNH
    // =======================================================
    function initTouchZoomPan() {
      const img = document.getElementById('modalImg');
      if (!img) return;

      img.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          const now = new Date().getTime();
          if (now - lastTapTime < 300) {
            // Nhấp kép (Double tap)
            if (scale > 1) { scale = 1; posX = 0; posY = 0; }
            else { scale = 2.5; posX = 0; posY = 0; }
            updateImgTransform();
            lastTapTime = 0;
            return;
          }
          lastTapTime = now;
          startX = e.touches[0].clientX - posX;
          startY = e.touches[0].clientY - posY;
        } else if (e.touches.length === 2) {
          initialDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialScale = scale;
        }
      }, { passive: true });

      img.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && scale > 1) {
          posX = e.touches[0].clientX - startX;
          posY = e.touches[0].clientY - startY;
          updateImgTransform();
        } else if (e.touches.length === 2) {
          const currentDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (initialDist > 0) {
            scale = Math.max(1, Math.min(4, initialScale * (currentDist / initialDist)));
            if (scale === 1) { posX = 0; posY = 0; }
            updateImgTransform();
          }
        }
      }, { passive: true });

      img.addEventListener('touchend', () => {
        if (scale <= 1) {
          scale = 1; posX = 0; posY = 0;
          updateImgTransform();
        }
      });
    }

    function updateImgTransform() {
      const img = document.getElementById('modalImg');
      if (img) img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    function resetZoomPan() {
      scale = 1; posX = 0; posY = 0;
      updateImgTransform();
    }

    function openSingleImageModal(photo) {
      activeModalImgId = photo.id;
      document.getElementById('modalImg').src = photo.dataUrl;
      resetZoomPan();
      document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.add('hidden');
      activeModalImgId = null;
      resetZoomPan();
    }

    async function changeImageFolder(newFolder) {
      if (!activeModalImgId) return;
      await firestore.collection("photos").doc(activeModalImgId).update({ folder: newFolder });
      closeModal();
    }

    async function deleteSingleImage() {
      if (!confirm("Xóa vĩnh viễn hình ảnh này trên Cloud?")) return;
      await firestore.collection("photos").doc(activeModalImgId).delete();
      closeModal();
      renderCalendar();
    }

    // =======================================================
    // 📥 TÍNH NĂNG LƯU VỀ MÁY & CHIA SẺ NATIVE
    // =======================================================
    async function dataUrlToFile(dataUrl, filename) {
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      return new File([blob], filename, { type: blob.type || 'image/jpeg' });
    }

    function downloadDataUrl(dataUrl, filename) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function saveSingleToPhotos() {
      if (!activeModalImgId) return;
      const photo = currentFolderPhotosCache.find(p => p.id === activeModalImgId);
      if (!photo) return;
      
      const filename = `ZemaR_${photo.branch}_${photo.date}.jpg`;
      downloadDataUrl(photo.dataUrl, filename);
    }

    async function shareSingleImage() {
      if (!activeModalImgId) return;
      const photo = currentFolderPhotosCache.find(p => p.id === activeModalImgId);
      if (!photo) return;

      const filename = `ZemaR_${photo.branch}_${photo.date}.jpg`;
      try {
        const file = await dataUrlToFile(photo.dataUrl, filename);
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: `Zema R - ${photo.branch}`,
            files: [file]
          });
        } else {
          downloadDataUrl(photo.dataUrl, filename);
        }
      } catch (err) {
        if (err.name !== 'AbortError') downloadDataUrl(photo.dataUrl, filename);
      }
    }

    function toggleBatchSelect(id) {
      isBatchMode = true;
      if (selectedImageIds.has(id)) selectedImageIds.delete(id);
      else selectedImageIds.add(id);

      if (selectedImageIds.size === 0) exitBatchMode();
      else {
        document.getElementById('batchBar').classList.remove('hidden');
        document.getElementById('batchCount').innerText = selectedImageIds.size;
        listenToCloudPhotos();
      }
    }

    function toggleSelectAll() {
      if (!currentFolderPhotosCache) return;
      if (selectedImageIds.size === currentFolderPhotosCache.length) {
        selectedImageIds.clear();
        exitBatchMode();
      } else {
        isBatchMode = true;
        currentFolderPhotosCache.forEach(p => selectedImageIds.add(p.id));
        document.getElementById('batchBar').classList.remove('hidden');
        document.getElementById('batchCount').innerText = selectedImageIds.size;
        listenToCloudPhotos();
      }
    }

    function exitBatchMode() {
      isBatchMode = false;
      selectedImageIds.clear();
      document.getElementById('batchBar').classList.add('hidden');
      listenToCloudPhotos();
    }

    async function batchSaveToPhotos() {
      if (selectedImageIds.size === 0) return;
      const selectedPhotos = currentFolderPhotosCache.filter(p => selectedImageIds.has(p.id));

      let count = 0;
      for (let photo of selectedPhotos) {
        count++;
        const filename = `ZemaR_${photo.branch}_${photo.date}_${count}.jpg`;
        downloadDataUrl(photo.dataUrl, filename);
        await new Promise(r => setTimeout(r, 300));
      }
    }

    async function batchShare() {
      if (selectedImageIds.size === 0) return;
      const selectedPhotos = currentFolderPhotosCache.filter(p => selectedImageIds.has(p.id));

      try {
        const files = [];
        for (let i = 0; i < selectedPhotos.length; i++) {
          const photo = selectedPhotos[i];
          const file = await dataUrlToFile(photo.dataUrl, `ZemaR_${photo.branch}_${i+1}.jpg`);
          files.push(file);
        }

        if (navigator.canShare && navigator.canShare({ files })) {
          await navigator.share({
            title: `Zema R - ${currentBranch}`,
            files: files
          });
        } else {
          alert("Trình duyệt thiết bị không hỗ trợ chia sẻ đồng thời nhiều tệp. Đang chuyển sang tải về máy...");
          batchSaveToPhotos();
        }
      } catch (err) {
        if (err.name !== 'AbortError') batchSaveToPhotos();
      }
    }

    async function batchDelete() {
      if (!confirm(`Xóa vĩnh viễn ${selectedImageIds.size} ảnh đã chọn trên Cloud?`)) return;
      for (let id of selectedImageIds) {
        await firestore.collection("photos").doc(id).delete();
      }
      exitBatchMode();
      renderCalendar();
    }
  </script>
