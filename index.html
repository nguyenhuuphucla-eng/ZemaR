<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Zema R - Quản Lý Hình Ảnh</title>

  <!-- PWA iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zema R">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/z.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .has-photos {
      background-color: #10b981 !important; /* Màu xanh khi có ảnh */
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .no-photos {
      opacity: 0.25;
      background-color: #334155;
      color: #94a3b8;
    }
    .selected-day {
      outline: 3px solid #ec4899;
      transform: scale(1.05);
      z-index: 10;
    }
    .zema-logo {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      color: white;
      font-weight: 900;
      font-family: 'Arial Black', sans-serif;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-10">

  <!-- Top Bar: Chọn chi nhánh & Cài đặt Pass 0000 -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="zema-logo w-9 h-9 text-xl italic transform -skew-x-6">Z</div>
        <div>
          <h1 class="text-lg font-black tracking-wide text-pink-500 leading-none">ZEMA R</h1>
          <span class="text-[10px] text-slate-400 font-medium">Quản Lý Ảnh</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <select id="branchSelect" onchange="onBranchChange()" class="bg-slate-800 text-pink-400 border border-pink-500/30 font-bold text-xs rounded-lg px-3 py-2 outline-none">
        </select>
        <button onclick="promptAdminBranch()" class="bg-slate-800 text-slate-300 p-2 rounded-lg border border-slate-700">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Nội dung chính -->
  <main class="max-w-md mx-auto w-full flex-1 px-4 py-3 space-y-4">

    <!-- Lịch chọn ngày -->
    <section class="bg-slate-900/80 rounded-2xl p-3.5 border border-slate-800 shadow-xl">
      <div class="flex justify-between items-center mb-3 px-1">
        <button onclick="changeMonth(-1)" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <span id="calendarMonthYear" class="font-bold text-sm text-pink-400 uppercase tracking-wider">Tháng --/----</span>
        <button onclick="changeMonth(1)" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
      </div>

      <div class="grid grid-cols-7 gap-1.5 text-center text-[11px] font-bold text-slate-400 mb-2">
        <span>CN</span><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span>
      </div>

      <div id="calendarDays" class="grid grid-cols-7 gap-1.5"></div>
    </section>

    <!-- Thư mục & Nút Chụp Ảnh Tốc Độ Cao -->
    <section class="space-y-3">
      <div class="flex items-center justify-between gap-2">
        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 flex-1">
          <button onclick="switchFolder('may')" id="tab-may" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all text-pink-400 bg-slate-800">
            Hình Máy <span id="count-may" class="text-[10px] opacity-75">(0)</span>
          </button>
          <button onclick="switchFolder('phieu_sua')" id="tab-phieu_sua" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all text-slate-400">
            Phiếu Sửa <span id="count-phieu_sua" class="text-[10px] opacity-75">(0)</span>
          </button>
          <button onclick="switchFolder('hoa_don')" id="tab-hoa_don" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all text-slate-400">
            Hóa Đơn <span id="count-hoa_don" class="text-[10px] opacity-75">(0)</span>
          </button>
        </div>

        <!-- Chụp / Tải ảnh lên -->
        <button onclick="triggerCameraInput()" class="bg-gradient-to-r from-pink-500 to-rose-600 text-white font-bold px-3.5 py-2.5 rounded-xl shadow-lg flex items-center gap-1 text-xs active:scale-95 transition-transform">
          <i data-lucide="camera" class="w-4 h-4"></i> Chụp
        </button>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageCapture(event)">
      </div>

      <!-- Thanh công cụ chọn nhiều (Batch Mode) -->
      <div id="batchBar" class="hidden bg-pink-950/80 border border-pink-500/40 rounded-xl p-2.5 flex items-center justify-between">
        <span class="text-xs font-semibold text-pink-200">Đã chọn <b id="batchCount">0</b> ảnh</span>
        <div class="flex gap-2">
          <button onclick="batchShare()" class="bg-pink-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1">
            <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Share
          </button>
          <button onclick="batchDelete()" class="bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Xóa
          </button>
          <button onclick="exitBatchMode()" class="bg-slate-800 text-slate-300 text-xs px-2 py-1.5 rounded-lg">Hủy</button>
        </div>
      </div>
    </section>

    <!-- Danh sách Ảnh -->
    <section>
      <div id="imageGrid" class="grid grid-cols-2 gap-3"></div>
      <div id="emptyState" class="hidden text-center py-12 text-slate-500 space-y-2">
        <i data-lucide="image-off" class="w-10 h-10 mx-auto text-slate-600"></i>
        <p class="text-xs font-medium">Chưa có ảnh trong mục này</p>
      </div>
    </section>

  </main>

  <!-- Copyright Footer -->
  <footer class="mt-8 text-center text-[11px] text-slate-500 py-3 border-t border-slate-900">
    <p class="font-medium text-slate-400">© Copyright Nguyễn Hữu Phúc</p>
    <p class="text-[10px] text-slate-500 mt-0.5">Tel: 0908893082</p>
  </footer>

  <!-- Viewer Xem Ảnh Full Màn Hình -->
  <div id="imageModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-between p-4">
    <div class="flex justify-between items-center text-white z-10">
      <div class="text-left">
        <p id="modalBranch" class="text-xs font-bold text-pink-400">---</p>
        <p id="modalDate" class="text-[10px] text-slate-300">--- <span class="italic text-slate-400 font-normal ml-1">@ Nguyễn Hữu Phúc</span></p>
      </div>
      <button onclick="closeModal()" class="p-2 bg-slate-800/80 rounded-full text-slate-300"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <div class="flex-1 flex items-center justify-center overflow-hidden my-auto">
      <img id="modalImg" class="max-h-[75vh] max-w-full object-contain transition-transform duration-200" style="transform: scale(1);" alt="Preview">
    </div>

    <div class="flex justify-around items-center bg-slate-900/90 backdrop-blur-md rounded-2xl py-3 border border-slate-800">
      <button onclick="zoomModalImage(0.25)" class="flex flex-col items-center text-slate-300 text-xs gap-1">
        <i data-lucide="zoom-in" class="w-5 h-5 text-pink-400"></i> Phóng
      </button>
      <button onclick="zoomModalImage(-0.25)" class="flex flex-col items-center text-slate-300 text-xs gap-1">
        <i data-lucide="zoom-out" class="w-5 h-5 text-pink-400"></i> Thu nhỏ
      </button>
      <button onclick="shareSingleImage()" class="flex flex-col items-center text-slate-300 text-xs gap-1">
        <i data-lucide="share-2" class="w-5 h-5 text-blue-400"></i> Chia sẻ
      </button>
      <button onclick="deleteSingleImage()" class="flex flex-col items-center text-red-400 text-xs gap-1">
        <i data-lucide="trash-2" class="w-5 h-5 text-red-500"></i> Xóa
      </button>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "0000";
    const DEFAULT_BRANCHES = [
      "CN 190 3/2", "CN 352 Trường Chinh", "CN 101 Bùi Thị Xuân",
      "CN 04 Hai Bà Trưng", "CN 76 Quốc Hương", "CN 45 Cao Thắng",
      "CN 84 Nguyễn Thị Thập", "CN 12 Phan Văn Trị", "CN 25 Hoàng Văn Thụ",
      "CN 18 Phạm Văn Đồng", "CN 09 Quang Trung", "CN 33 Võ Văn Ngân", "CN 52 Kinh Dương Vương"
    ];

    let currentBranch = "";
    let selectedDate = new Date().toISOString().split('T')[0];
    let calendarMonth = new Date().getMonth();
    let calendarYear = new Date().getFullYear();
    let currentFolder = "may";
    let db = null;

    let isBatchMode = false;
    let selectedImageIds = new Set();
    let activeModalImgId = null;
    let currentZoomScale = 1;

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await initIndexedDB();
      initBranches();
      renderCalendar();
      loadImagesForCurrentView();
    });

    // Khởi tạo Database nhanh
    function initIndexedDB() {
      return new Promise((resolve) => {
        const request = indexedDB.open("ZemaR_FastDB", 2);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains("photos")) {
            const store = db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
            store.createIndex("date", "date", { unique: false });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve();
        };
      });
    }

    // Quản lý Chi nhánh
    function initBranches() {
      let savedBranches = JSON.parse(localStorage.getItem('zema_branches')) || DEFAULT_BRANCHES;
      localStorage.setItem('zema_branches', JSON.stringify(savedBranches));
      currentBranch = localStorage.getItem('zema_current_branch') || savedBranches[0];
      renderBranchDropdown(savedBranches);
    }

    function renderBranchDropdown(branches) {
      const select = document.getElementById('branchSelect');
      select.innerHTML = branches.map(b => `<option value="${b}" ${b === currentBranch ? 'selected' : ''}>${b}</option>`).join('');
    }

    function onBranchChange() {
      currentBranch = document.getElementById('branchSelect').value;
      localStorage.setItem('zema_current_branch', currentBranch);
      loadImagesForCurrentView(); // Đổi chi nhánh -> Mark tên chi nhánh tự đổi theo
    }

    function promptAdminBranch() {
      const pass = prompt("Nhập mật khẩu xác nhận (Mặc định: 0000):");
      if (pass !== ADMIN_PASS) {
        alert("Mật khẩu không chính xác!");
        return;
      }

      const action = prompt("1. Thêm Chi Nhánh Mới\n2. Đổi Tên Chi Nhánh Hiện Tại", "1");
      let branches = JSON.parse(localStorage.getItem('zema_branches')) || DEFAULT_BRANCHES;

      if (action === "1") {
        const newName = prompt("Nhập tên chi nhánh mới:");
        if (newName && newName.trim()) {
          branches.push(newName.trim());
          currentBranch = newName.trim();
        }
      } else if (action === "2") {
        const newName = prompt("Nhập tên mới cho [" + currentBranch + "]:");
        if (newName && newName.trim()) {
          const idx = branches.indexOf(currentBranch);
          if (idx !== -1) branches[idx] = newName.trim();
          currentBranch = newName.trim();
        }
      }
      localStorage.setItem('zema_branches', JSON.stringify(branches));
      localStorage.setItem('zema_current_branch', currentBranch);
      renderBranchDropdown(branches);
      loadImagesForCurrentView();
    }

    // Xử lý Lịch
    async function renderCalendar() {
      const monthYearElem = document.getElementById('calendarMonthYear');
      const daysContainer = document.getElementById('calendarDays');
      const monthNames = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
      monthYearElem.innerText = `${monthNames[calendarMonth]} / ${calendarYear}`;

      const datesWithPhotos = await getDatesWithPhotosInMonth(calendarYear, calendarMonth);
      const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
      const totalDays = new Date(calendarYear, calendarMonth + 1, 0).getDate();

      daysContainer.innerHTML = "";
      for (let i = 0; i < firstDay; i++) daysContainer.innerHTML += `<div></div>`;

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasPhotos = datesWithPhotos.has(dateStr);
        const isSelected = dateStr === selectedDate;

        const dayElem = document.createElement('div');
        dayElem.className = `calendar-day ${hasPhotos ? 'has-photos' : 'no-photos'} ${isSelected ? 'selected-day' : ''}`;
        dayElem.innerText = day;
        dayElem.onclick = () => { selectedDate = dateStr; renderCalendar(); loadImagesForCurrentView(); };
        daysContainer.appendChild(dayElem);
      }
    }

    function changeMonth(delta) {
      calendarMonth += delta;
      if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
      if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
      renderCalendar();
    }

    function getDatesWithPhotosInMonth(year, month) {
      return new Promise((resolve) => {
        const transaction = db.transaction(["photos"], "readonly");
        const store = transaction.objectStore("photos");
        const dates = new Set();
        store.openCursor().onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            const date = cursor.value.date;
            const [y, m] = date.split('-').map(Number);
            if (y === year && m === (month + 1)) dates.add(date);
            cursor.continue();
          } else { resolve(dates); }
        };
      });
    }

    // Chuyển Folder & Hiển thị
    function switchFolder(folder) {
      currentFolder = folder;
      ['may', 'phieu_sua', 'hoa_don'].forEach(f => {
        const btn = document.getElementById(`tab-${f}`);
        btn.className = (f === folder) 
          ? "flex-1 py-1.5 text-xs font-bold rounded-lg text-pink-400 bg-slate-800" 
          : "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-400";
      });
      loadImagesForCurrentView();
    }

    async function loadImagesForCurrentView() {
      const grid = document.getElementById('imageGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = "";

      const allPhotosForDay = await getPhotosByDate(selectedDate);
      document.getElementById('count-may').innerText = `(${allPhotosForDay.filter(p => p.folder === 'may').length})`;
      document.getElementById('count-phieu_sua').innerText = `(${allPhotosForDay.filter(p => p.folder === 'phieu_sua').length})`;
      document.getElementById('count-hoa_don').innerText = `(${allPhotosForDay.filter(p => p.folder === 'hoa_don').length})`;

      const folderPhotos = allPhotosForDay.filter(p => p.folder === currentFolder);

      if (folderPhotos.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      folderPhotos.forEach(photo => {
        const card = document.createElement('div');
        card.className = "relative rounded-xl overflow-hidden bg-slate-900 border border-slate-800 shadow-lg cursor-pointer";
        
        const imgContainer = document.createElement('div');
        imgContainer.className = "relative aspect-square bg-slate-950";
        
        const img = document.createElement('img');
        img.src = photo.dataUrl;
        img.className = "w-full h-full object-cover";

        // MARK CHỮ THEO YÊU CẦU: Dòng trên Tên Chi Nhánh, Dòng dưới Ngày + @ Nguyễn Hữu Phúc in nghiêng
        const watermark = document.createElement('div');
        watermark.className = "absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/95 via-black/70 to-transparent p-2 text-left";
        watermark.innerHTML = `
          <p class="text-[11px] font-bold text-pink-400 truncate leading-tight">${currentBranch}</p>
          <p class="text-[9px] text-slate-300 font-medium leading-tight mt-0.5">
            ${photo.capturedDate} <span class="text-slate-400 italic font-normal ml-0.5">@ Nguyễn Hữu Phúc</span>
          </p>
        `;

        const checkOverlay = document.createElement('div');
        checkOverlay.className = `absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-white flex items-center justify-center ${selectedImageIds.has(photo.id) ? 'bg-pink-500 border-pink-500' : 'bg-black/40'}`;
        if (selectedImageIds.has(photo.id)) checkOverlay.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>`;

        imgContainer.appendChild(img);
        imgContainer.appendChild(watermark);
        imgContainer.appendChild(checkOverlay);
        card.appendChild(imgContainer);

        // Giữ lâu để chọn nhiều
        let pressTimer;
        card.addEventListener('touchstart', () => { pressTimer = setTimeout(() => toggleBatchSelect(photo.id), 400); });
        card.addEventListener('touchend', () => clearTimeout(pressTimer));
        card.addEventListener('mousedown', () => { pressTimer = setTimeout(() => toggleBatchSelect(photo.id), 400); });
        card.addEventListener('mouseup', () => clearTimeout(pressTimer));

        card.onclick = () => {
          if (isBatchMode) toggleBatchSelect(photo.id);
          else openSingleImageModal(photo);
        };

        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    function getPhotosByDate(dateStr) {
      return new Promise((resolve) => {
        const transaction = db.transaction(["photos"], "readonly");
        const store = transaction.objectStore("photos");
        const index = store.index("date");
        const request = index.getAll(dateStr);
        request.onsuccess = () => resolve(request.result || []);
      });
    }

    // Chụp & LưuSiêu Tốc (Xử lý ngay lập tức)
    function triggerCameraInput() {
      document.getElementById('cameraInput').click();
    }

    async function handleImageCapture(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        const dataUrl = e.target.result;
        const now = new Date();
        const dateFormatted = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
        const dateKey = now.toISOString().split('T')[0];

        const photoObj = {
          date: dateKey,
          folder: currentFolder, // Lưu trực tiếp vào thư mục đang chọn
          capturedDate: dateFormatted,
          dataUrl: dataUrl
        };

        const tx = db.transaction(["photos"], "readwrite");
        tx.objectStore("photos").add(photoObj);
        tx.oncomplete = () => {
          selectedDate = dateKey;
          renderCalendar();
          loadImagesForCurrentView();
        };
      };
      reader.readAsDataURL(file);
      event.target.value = ""; // Reset input
    }

    // Viewer & Thao tác
    function openSingleImageModal(photo) {
      activeModalImgId = photo.id;
      document.getElementById('modalImg').src = photo.dataUrl;
      document.getElementById('modalBranch').innerText = currentBranch;
      document.getElementById('modalDate').innerHTML = `${photo.capturedDate} <span class="italic text-slate-400 font-normal ml-1">@ Nguyễn Hữu Phúc</span>`;
      currentZoomScale = 1;
      document.getElementById('modalImg').style.transform = `scale(1)`;
      document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.add('hidden');
      activeModalImgId = null;
    }

    function zoomModalImage(delta) {
      currentZoomScale = Math.max(0.5, Math.min(3, currentZoomScale + delta));
      document.getElementById('modalImg').style.transform = `scale(${currentZoomScale})`;
    }

    async function deleteSingleImage() {
      if (!confirm("Xác nhận xóa hình ảnh này?")) return;
      const tx = db.transaction(["photos"], "readwrite");
      tx.objectStore("photos").delete(activeModalImgId);
      tx.oncomplete = () => {
        closeModal();
        renderCalendar();
        loadImagesForCurrentView();
      };
    }

    async function shareSingleImage() {
      const tx = db.transaction(["photos"], "readonly");
      const req = tx.objectStore("photos").get(activeModalImgId);
      req.onsuccess = async () => {
        const photo = req.result;
        if (photo && navigator.share) {
          const blob = await (await fetch(photo.dataUrl)).blob();
          const file = new File([blob], `ZemaR_${photo.capturedDate.replaceAll('/','-')}.jpg`, { type: 'image/jpeg' });
          try { await navigator.share({ title: currentBranch, files: [file] }); } catch (e) {}
        }
      };
    }

    // Chọn nhiều (Batch Delete & Share)
    function toggleBatchSelect(id) {
      isBatchMode = true;
      if (selectedImageIds.has(id)) selectedImageIds.delete(id);
      else selectedImageIds.add(id);

      if (selectedImageIds.size === 0) exitBatchMode();
      else {
        document.getElementById('batchBar').classList.remove('hidden');
        document.getElementById('batchCount').innerText = selectedImageIds.size;
        loadImagesForCurrentView();
      }
    }

    function exitBatchMode() {
      isBatchMode = false;
      selectedImageIds.clear();
      document.getElementById('batchBar').classList.add('hidden');
      loadImagesForCurrentView();
    }

    async function batchDelete() {
      if (!confirm(`Xóa ${selectedImageIds.size} ảnh đã chọn?`)) return;
      const tx = db.transaction(["photos"], "readwrite");
      const store = tx.objectStore("photos");
      selectedImageIds.forEach(id => store.delete(id));
      tx.oncomplete = () => { exitBatchMode(); renderCalendar(); };
    }

    async function batchShare() {
      const filesArr = [];
      const tx = db.transaction(["photos"], "readonly");
      const store = tx.objectStore("photos");
      
      for (let id of selectedImageIds) {
        const photo = await new Promise(res => { store.get(id).onsuccess = e => res(e.target.result); });
        if (photo) {
          const blob = await (await fetch(photo.dataUrl)).blob();
          filesArr.push(new File([blob], `ZemaR_${id}.jpg`, { type: 'image/jpeg' }));
        }
      }
      if (navigator.share && filesArr.length > 0) {
        try { await navigator.share({ title: 'Zema R Multi Share', files: filesArr }); } catch (e) {}
      }
    }
  </script>
</body>
</html>
